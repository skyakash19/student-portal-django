{% extends 'base.html' %}
{% block title %}Password Reset Successful{% endblock %}
{% block content %}
<div class="container mt-5 text-center text-light">
    <div class="glass-card mx-auto" style="max-width: 600px;">
        <h3>✅ Your Password Has Been Reset!</h3>
        <p class="mt-3">You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="btn btn-neon mt-3">Login</a>
    </div>
</div>
{% endblock %}
