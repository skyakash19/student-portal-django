{% extends 'base.html' %}
{% block title %}Reset Your Password{% endblock %}
{% block content %}
<div class="container mt-5 text-light">
    <div class="glass-card mx-auto" style="max-width: 600px;">
        <h3 class="mb-4">🔐 Enter New Password</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-neon w-100">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
