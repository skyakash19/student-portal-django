{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="glass-card p-4 mx-auto shadow-lg text-center" style="max-width: 600px; backdrop-filter: blur(10px); border-radius: 15px; background-color: rgba(255, 255, 255, 0.07); color: #fff;">
        <h3 class="mb-3 fw-bold heading-glow">🔑 Forgot Your Password?</h3>

        <p class="mb-4 text-muted" style="color: #dddddd;">Enter your registered email address below and we’ll send you a reset link.</p>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label for="id_email" class="form-label" style="color: #ffffff;">Email address</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn btn-neon w-100">📩 Send Reset Link</button>
        </form>
    </div>
</div>

<style>
    .glass-card {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-neon {
        background: linear-gradient(135deg, #875cf5, #5c27fe);
        border: none;
        color: #fff;
        font-weight: 600;
        transition: all 0.3s ease-in-out;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(135, 92, 245, 0.5);
    }

    .btn-neon:hover {
        box-shadow: 0 0 20px rgba(135, 92, 245, 0.8), 0 0 30px rgba(92, 39, 254, 0.8);
        transform: translateY(-2px);
    }

    .heading-glow {
    background: linear-gradient(135deg, #ff8a00, #e52e71);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
    font-size: 2rem;
    text-shadow: 1px 1px 8px rgba(229, 46, 113, 0.4);
}


    html[data-bs-theme='dark'] .heading-glow {
        text-shadow: 1px 1px 12px rgba(255, 138, 0, 0.7), 0 0 20px rgba(229, 46, 113, 0.6);
    }

    html[data-bs-theme='dark'] .glass-card {
        background-color: rgba(33, 37, 41, 0.7);
    }

    html[data-bs-theme='dark'] h3,
    html[data-bs-theme='dark'] label {
        color: #ffffff;
    }

    html[data-bs-theme='dark'] .text-muted {
        color: #cccccc !important;
    }
</style>
{% endblock %}
