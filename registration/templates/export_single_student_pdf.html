<!-- templates/export_single_student_pdf.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Helvetica, sans-serif; font-size: 14px; margin: 20px; }
        h1 { color: #4B0082; text-align: center; }
        .info { margin-top: 30px; }
        .info p { margin: 10px 0; }
        .footer { margin-top: 40px; font-size: 12px; text-align: right; color: #888; }
    </style>
</head>
<body>
    <h1>🎓 Student Profile</h1>

    <div class="info">
        <p><strong>Username:</strong> {{ student.user.username }}</p>
        <p><strong>Email:</strong> {{ student.user.email }}</p>
        <p><strong>Date Joined:</strong> {{ student.user.date_joined|date:"F d, Y" }}</p>
    </div>

    <div class="footer">
        Generated by {{ admin }} on {{ generated_on }}
    </div>
</body>
</html>
