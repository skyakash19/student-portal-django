{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-danger rounded-4">
                <div class="card-header bg-danger text-white py-3 rounded-top-4">
                    <h3 class="mb-0 fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirm Deletion</h3>
                </div>
                <div class="card-body p-4">
                    <p class="lead">
                        Are you sure you want to delete the student:
                        <strong class="text-danger">{{ student.user.username }}</strong>?
                        This action cannot be undone.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'student_list' %}" class="btn btn-secondary rounded-pill">
                                <i class="bi bi-arrow-left-circle me-2"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-danger rounded-pill">
                                <i class="bi bi-trash-fill me-2"></i>Confirm Delete
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        border-width: 2px !important;
    }
</style>
{% endblock %}
